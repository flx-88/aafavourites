<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Alix & Alessandro Favourites'</title>
<meta name="description" content="All the suggestions you need">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg: #FFFFFF;
    --panel-2: #F4E3C1;      /* sand — cards, gate box */
    --ink: #1D3A45;          /* dark ocean ink — all text & icon-on-color */
    --ocean: #3FA9F5;        /* primary accent */
    --ocean-bright: #6EC1FF;
    --sun: #F6C453;          /* warm yellow — secondary accent */
    --palm: #2E8B57;         /* palm green — tertiary accent */
    --line: rgba(29,58,69,0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;height:100dvh;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  header{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:18px 24px 14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    background: var(--bg);
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    margin:0;
    color: var(--ocean);
  }
  header .tagline{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color: var(--palm);
    opacity:0.85;
  }

  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }

  #sidebar{
    width:340px;
    flex-shrink:0;
    background: var(--bg);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
    position:relative;
    z-index:20;
  }

  #search{
    margin:16px 16px 10px;
    padding:10px 12px;
    background: var(--bg);
    border:1px solid var(--line);
    border-radius:3px;
    color: var(--ink);
    font-family:'Space Mono', monospace;
    font-size:13px;
  }
  #search:focus{outline:1px solid var(--ocean); border-color: var(--ocean);}

  .filter-label{
    margin:0 16px 8px;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color: var(--palm);
    opacity:0.9;
  }

  #filters{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:0 16px 14px;
    border-bottom:1px solid var(--line);
  }
  .chip{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    cursor:pointer;
    background:transparent;
    color: var(--ink);
    opacity:0.65;
    transition: all .15s ease;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .chip.active{opacity:1; border-color: currentColor; background: rgba(29,58,69,0.05);}

  #list{
    flex:1;
    overflow-y:auto;
    padding: 6px 0 20px;
  }
  #list::-webkit-scrollbar{width:6px;}
  #list::-webkit-scrollbar-thumb{background: var(--panel-2); border-radius:4px;}

  .place-card{
    margin:10px 14px;
    padding:12px 14px;
    background: var(--panel-2);
    border-left: 3px solid var(--ocean);
    border-radius:2px;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
    position:relative;
  }
  .place-card:hover{background:#EFDCAE; transform: translateX(2px);}
  .place-card.selected{background:#EFDCAE; box-shadow: inset 0 0 0 1px var(--ocean);}

  .place-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15.5px;
    color: var(--ink);
    margin:0 0 4px;
  }
  .place-cat{
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    opacity:0.75;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    row-gap:4px;
    gap:6px;
  }
  .place-cat .dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .place-addr{font-size:11.5px; opacity:0.6; margin-bottom:4px;}
  .place-note{font-size:12px; opacity:0.85; line-height:1.4; font-family: 'Fraunces', serif;}

  .place-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:8px;
    font-size:11px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color: var(--ocean);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .place-link:hover{border-bottom-color: var(--ocean);}
  .popup-note + .place-link{margin-top:8px; display:inline-flex;}

  .empty-msg, .status-msg{padding:30px 20px; text-align:center; opacity:0.6; font-size:12.5px; line-height:1.6;}
  .status-msg.error{color:#D64545; opacity:0.9;}

  #map{flex:1; background:#EAF4FB; position:relative; z-index:1; overflow:hidden;}

  .leaflet-popup-content-wrapper{
    background: var(--bg);
    color: var(--ink);
    border-radius:3px;
    border: 1px solid var(--ocean);
  }
  .leaflet-popup-tip{background: var(--bg);}
  .popup-name{font-family:'Fraunces', serif; font-weight:700; font-size:16px; margin:0 0 4px; color:var(--ocean);}
  .popup-cat{font-size:10px; text-transform:uppercase; letter-spacing:1px; opacity:0.7; margin-bottom:6px;}
  .popup-addr{font-size:11.5px; opacity:0.65; margin-bottom:6px;}
  .popup-note{font-size:12.5px; line-height:1.4; font-family:'Fraunces', serif;}

  .pin-icon{
    width:28px; height:28px;
    border-radius:50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #FFFFFF;
    box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
  }
  .pin-icon i{
    transform: rotate(45deg);
    color: var(--ink);
    font-size:12px;
  }

  .cluster-icon{
    background: var(--sun);
    border: 2px solid #FFFFFF;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink);
    font-family:'Space Mono', monospace;
    font-weight:700;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .cluster-small{width:34px;height:34px;font-size:12px;}
  .cluster-medium{width:42px;height:42px;font-size:13px; background: var(--ocean-bright); color:#FFFFFF;}
  .cluster-large{width:50px;height:50px;font-size:14px; background:var(--ocean); color:#FFFFFF; border-color:#fff;}

  #viewToggle{display:none;}

  @media (max-width: 720px){
    header{padding:10px 16px 8px; gap:2px; flex-wrap:wrap;}
    header h1{font-size:17px; line-height:1.25;}
    header .tagline{display:none;}

    #sidebar{width:100%; flex:1;}
    #map{display:none; width:100%;}
    body.show-map #sidebar{display:none;}
    body.show-map #map{display:block; flex:1;}

    #viewToggle{
      display:block;
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      z-index:60;
      background: var(--ocean);
      color: #FFFFFF;
      border:none;
      padding:12px 26px;
      border-radius:24px;
      font-family:'Space Mono', monospace;
      font-weight:700;
      font-size:12.5px;
      letter-spacing:0.5px;
      text-transform:uppercase;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      cursor:pointer;
    }
  }

  /* Password gate */
  #gate{
    position:fixed; inset:0;
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    z-index: 9999;
  }
  #gate-box{
    text-align:center;
    padding:36px 40px;
    background: var(--panel-2);
    border:1px solid var(--line);
    border-radius:4px;
    max-width:320px;
  }
  #gate-box h2{
    font-family:'Fraunces', serif;
    color: var(--ocean);
    margin:0 0 8px;
    font-size:22px;
  }
  #gate-box p{
    font-size:12px;
    opacity:0.7;
    margin:0 0 18px;
    line-height:1.5;
  }
  #gate-input{
    width:100%;
    padding:10px 12px;
    background: var(--bg);
    border:1px solid var(--line);
    border-radius:3px;
    color: var(--ink);
    font-family:'Space Mono', monospace;
    font-size:14px;
    margin-bottom:10px;
  }
  #gate-input:focus{outline:1px solid var(--ocean); border-color: var(--ocean);}
  #gate-submit{
    width:100%;
    padding:10px 12px;
    background: var(--ocean);
    border:none;
    border-radius:3px;
    color: #FFFFFF;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
  }
  #gate-submit:hover{background: var(--ocean-bright);}
  #gate-error{
    color:#E1633D;
    font-size:11.5px;
    margin-top:10px;
    min-height:14px;
  }
  body.locked .layout{display:none;}
</style>
</head>
<body class="locked">

<div id="gate">
  <div id="gate-box">
    <h2>Alix & Alessandro Favourites'</h2>
    <p>This map is just for family &amp; friends.<br>Enter the password to continue.</p>
    <input type="password" id="gate-input" placeholder="Password" autocomplete="off" />
    <button id="gate-submit">Enter</button>
    <div id="gate-error"></div>
  </div>
</div>

<header>
  <h1>Alix & Alessandro Favourites'</h1>
  <span class="tagline">All the suggestions you need</span>
</header>

<div class="layout">
  <div id="sidebar">
    <input type="text" id="search" placeholder="Search by city or country..." />
    <div class="filter-label">Search by category</div>
    <div id="filters"></div>
    <div id="list"><div class="status-msg">Loading places…</div></div>
  </div>
  <div id="map"></div>
</div>

<button id="viewToggle">Show Map</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>

/* ============================================================
   PASSWORD GATE
   ------------------------------------------------------------
   Change this to whatever you want to share with family/friends.
   NOTE: this is a simple deterrent, not real security — anyone
   who views this page's source code could find the password.
   It's meant to keep out search engines and casual strangers,
   not a determined snooper. That's fine for this use case, but
   don't reuse a password you use anywhere else.
   ============================================================ */
const SITE_PASSWORD = "changeme";

const gateInput = document.getElementById('gate-input');
const gateSubmit = document.getElementById('gate-submit');
const gateError = document.getElementById('gate-error');

function tryUnlock(){
  if (gateInput.value === SITE_PASSWORD){
    document.body.classList.remove('locked');
    document.getElementById('gate').remove();
    setTimeout(() => map.invalidateSize(), 100);
  } else {
    gateError.textContent = "Incorrect password — try again.";
    gateInput.value = '';
    gateInput.focus();
  }
}

gateSubmit.addEventListener('click', tryUnlock);
gateInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
gateInput.focus();

/* Mobile-only full-screen List/Map toggle (button is hidden via CSS on desktop) */
const viewToggle = document.getElementById('viewToggle');
viewToggle.addEventListener('click', () => {
  const showingMap = document.body.classList.toggle('show-map');
  viewToggle.textContent = showingMap ? 'Show List' : 'Show Map';
  if (showingMap) setTimeout(() => map.invalidateSize(), 100);
});

/* ============================================================
   YOUR PLACES NOW LIVE IN places.json, NOT HERE.
   ------------------------------------------------------------
   Open places.json to add, edit, or remove places. Each entry
   needs: name, category, address, lat, lng, note (note is
   optional). Keeping data separate from this file means an app
   (or any other page) can read the exact same places.json later.

   NOTE ON TESTING LOCALLY: browsers block a plain HTML file
   from fetching a local JSON file for security reasons (CORS).
   This will show an error if you just double-click index.html
   on your computer. It will work correctly once both files are
   uploaded to Altervista (or any real web server). To test
   locally first, you'd need to run a tiny local server — ask me
   if you want those steps.
   ============================================================ */

const DATA_URL = "places.json";

/* Pin groups — 6 visual groups covering all your place types, each
   with its own color and icon so pins are identifiable at a glance
   even on a small phone screen. Add a line here if a new category
   type ever appears; anything not listed falls back to "Other". */
const GROUPS = {
  "Food & Drink":       { color: "#E1633D", icon: "fa-utensils",
    members: ["Restaurant","Cafe","Bar","Beer","Wine","Bakery","Icecream","Pizza","Fastfood","Streetfood","Takeout","Supermarket","Nightclub"] },
  "Beaches":            { color: "#F0B860", icon: "fa-umbrella-beach",
    members: ["Beach"] },
  "Nature & Outdoors":  { color: "#4FA8A0", icon: "fa-tree",
    members: ["Forest","Hiking","Mountain","Park","Climbing","Ski","Swimming","Fishing"] },
  "Culture & Sights":   { color: "#C9A24B", icon: "fa-landmark",
    members: ["Art Gallery","Museum","Monument","Historic","Civic","Worship","Worship Christian","Spectacle","Music","School"] },
  "Lodging":            { color: "#5B8DEF", icon: "fa-bed",
    members: ["Lodging"] },
  "Shopping & Transit": { color: "#8B5FBF", icon: "fa-bag-shopping",
    members: ["Shopping","Parking","Train","Industry"] },
  "Personal Markers":   { color: "#8A9A5B", icon: "fa-heart",
    members: ["Heart","Thumbup","Geocode","Generic"] }
};
const GROUP_NAMES = Object.keys(GROUPS);
const DEFAULT_GROUP = { color: "#C9A24B", icon: "fa-map-pin" };

/* Reverse lookup: which group does a given place category belong to */
const CATEGORY_TO_GROUP = {};
for (const [groupName, group] of Object.entries(GROUPS)){
  group.members.forEach(cat => { CATEGORY_TO_GROUP[cat] = groupName; });
}

function groupFor(cat){
  return CATEGORY_TO_GROUP[cat] || null;
}

function pinFor(cat){
  const groupName = groupFor(cat);
  const group = groupName ? GROUPS[groupName] : DEFAULT_GROUP;
  return [group.color, group.icon];
}

/* Uses a real website URL if one is set on the place; otherwise
   falls back to a Google search for the name + address, which
   almost always surfaces the real site as the top result. */
function websiteFor(p){
  if (p.website) return p.website;
  const q = encodeURIComponent(`${p.name} ${p.address}`);
  return `https://www.google.com/search?q=${q}`;
}

/* Tags are open-ended (54+ of them, more may appear later), so tag
   chip colors are assigned automatically from a small palette rather
   than curated by hand. Same tag always gets the same color. */
const TAG_PALETTE = ["#E1633D","#4FA8A0","#C9A24B","#8B5FBF","#8A9A5B","#5B8DEF","#D46A9F","#4FA8A0","#E5A23D","#6FA8DC"];
function colorForTag(tag){
  let hash = 0;
  for (let i = 0; i < tag.length; i++){ hash = tag.charCodeAt(i) + ((hash << 5) - hash); }
  return TAG_PALETTE[Math.abs(hash) % TAG_PALETTE.length];
}

const map = L.map('map', { zoomControl: true }).setView([30, 10], 2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19
}).addTo(map);

function makeIcon(color, iconClass){
  return L.divIcon({
    className: '',
    html: `<div class="pin-icon" style="background:${color}"><i class="fa-solid ${iconClass}"></i></div>`,
    iconSize: [28,28],
    iconAnchor: [14,26],
    popupAnchor: [4,-22]
  });
}

let PLACES = [];
let markers = [];
let activeGroups = new Set();
let selectedIndex = null;

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const filtersEl = document.getElementById('filters');

fetch(DATA_URL)
  .then(res => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then(data => {
    PLACES = data;
    init();
  })
  .catch(err => {
    listEl.innerHTML = `<div class="status-msg error">
      Couldn't load places.json (${err.message}).<br><br>
      If you're viewing this file directly from your computer,
      that's expected — upload both index.html and places.json
      to your web host and reload from there.
    </div>`;
  });

function customClusterIcon(cluster){
  const count = cluster.getChildCount();
  let sizeClass = 'small';
  if (count >= 50) sizeClass = 'large';
  else if (count >= 10) sizeClass = 'medium';
  return L.divIcon({
    html: `<div class="cluster-icon cluster-${sizeClass}"><span>${count}</span></div>`,
    className: '',
    iconSize: L.point(44, 44)
  });
}

const clusterGroup = L.markerClusterGroup({
  iconCreateFunction: customClusterIcon,
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  maxClusterRadius: 50
});

function init(){
  markers = PLACES.map((p, i) => {
    const [pinColor, pinIcon] = pinFor(p.category);
    const marker = L.marker([p.lat, p.lng], { icon: makeIcon(pinColor, pinIcon) });
    marker.bindPopup(`
      <div class="popup-name">${p.name}</div>
      <div class="popup-cat">${(p.tags || []).join(' · ')}</div>
      <div class="popup-addr">${p.address}</div>
      <div class="popup-note">${p.note || ''}</div>
      <a class="place-link" href="${websiteFor(p)}" target="_blank" rel="noopener"><i class="fa-solid fa-globe"></i> Website</a>
    `);
    marker.on('click', () => selectPlace(i, false));
    return marker;
  });

  clusterGroup.addLayers(markers);
  map.addLayer(clusterGroup);

  activeGroups = new Set(); // empty = no filter, show everything

  GROUP_NAMES.forEach(groupName => {
    const group = GROUPS[groupName];
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.style.color = group.color;
    chip.innerHTML = `<i class="fa-solid ${group.icon}"></i>&nbsp;${groupName}`;
    chip.onclick = () => {
      if (activeGroups.has(groupName)) { activeGroups.delete(groupName); chip.classList.remove('active'); }
      else { activeGroups.add(groupName); chip.classList.add('active'); }
      renderList();
    };
    filtersEl.appendChild(chip);
  });

  searchEl.addEventListener('input', renderList);
  renderList();
}

function renderList(){
  const query = searchEl.value.trim().toLowerCase();
  listEl.innerHTML = '';
  let shown = 0;

  PLACES.forEach((p, i) => {
    const matchesGroup = activeGroups.size === 0 || activeGroups.has(groupFor(p.category));
    const searchable = [p.name, p.city, p.country];
    if (!p.city && !p.country) searchable.push(p.address); // fallback for unparsed addresses
    const haystack = searchable.join(' ').toLowerCase();
    const matchesQuery = !query || haystack.includes(query);
    const visible = matchesGroup && matchesQuery;

    /* keep the map pins in sync with the list filters */
    if (visible && !clusterGroup.hasLayer(markers[i])) clusterGroup.addLayer(markers[i]);
    if (!visible && clusterGroup.hasLayer(markers[i])) clusterGroup.removeLayer(markers[i]);

    if (!visible) return;
    shown++;

    const tagPills = (p.tags || []).map(t =>
      `<span class="dot" style="background:${colorForTag(t)}"></span>${t}`
    ).join('&nbsp;&nbsp;');

    const card = document.createElement('div');
    card.className = 'place-card' + (i === selectedIndex ? ' selected' : '');
    card.innerHTML = `
      <div class="place-name">${p.name}</div>
      <div class="place-cat">${tagPills}</div>
      <div class="place-addr">${p.address}</div>
      <div class="place-note">${p.note || ''}</div>
      <a class="place-link" href="${websiteFor(p)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fa-solid fa-globe"></i> Website</a>
    `;
    card.onclick = () => selectPlace(i, true);
    listEl.appendChild(card);
  });

  if (shown === 0){
    listEl.innerHTML = `<div class="empty-msg">No places match. Try clearing the search or turning a category back on.</div>`;
  }
}

function selectPlace(i, flyTo){
  selectedIndex = i;
  renderList();
  if (flyTo){
    if (window.innerWidth <= 720 && !document.body.classList.contains('show-map')){
      document.body.classList.add('show-map');
      viewToggle.textContent = 'Show List';
    }
    setTimeout(() => map.invalidateSize(), 50);
    clusterGroup.zoomToShowLayer(markers[i], () => {
      markers[i].openPopup();
    });
  } else {
    markers[i].openPopup();
  }
}

</script>
</body>
</html>
